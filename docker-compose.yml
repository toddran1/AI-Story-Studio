services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_story_studio
      POSTGRES_USER: ai_story_studio
      POSTGRES_PASSWORD: ai_story_studio
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "${POSTGRES_DATA_DIR:-./.data/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_story_studio -d ai_story_studio"]
      interval: 5s
      timeout: 3s
      retries: 12
